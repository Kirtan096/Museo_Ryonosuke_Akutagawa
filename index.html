<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto WebVR Kirtan</title>
     <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
     <script>
AFRAME.registerComponent('obra-interactiva', {
  schema: {
    ficha: { type: 'selector' }
  },

  init: function () {
    const obra = this.el;
    const ficha = this.data.ficha;

    if (!ficha) return;

    obra.addEventListener('mouseenter', () => {
      ficha.setAttribute('visible', true);
    });

    obra.addEventListener('mouseleave', () => {
      ficha.setAttribute('visible', false);
    });
  }
});
</script>
